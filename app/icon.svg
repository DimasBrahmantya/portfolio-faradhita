<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9a8d4" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a61d35" />
    </linearGradient>
    <radialGradient id="softGlow" cx="28%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Rounded squircle badge -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#roseGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#softGlow)" />
  <rect
    x="5"
    y="5"
    width="54"
    height="54"
    rx="15"
    fill="none"
    stroke="#fff1f5"
    stroke-opacity="0.45"
    stroke-width="1.5"
  />

  <!-- Top-right 4-point sparkle -->
  <path
    d="M48 11 L49.6 15.4 L54 17 L49.6 18.6 L48 23 L46.4 18.6 L42 17 L46.4 15.4 Z"
    fill="#fff7fa"
  />
  <!-- Tiny companion sparkle -->
  <circle cx="40.5" cy="13.5" r="1.4" fill="#ffe4ef" opacity="0.9" />

  <!-- Bottom-left tiny petal/heart dot -->
  <circle cx="15" cy="49" r="2" fill="#ffe4ef" opacity="0.8" />

  <!-- Elegant serif monogram "F" -->
  <text
    x="30"
    y="45"
    text-anchor="middle"
    font-family="Georgia, 'Playfair Display', 'Times New Roman', serif"
    font-size="38"
    font-weight="700"
    font-style="italic"
    fill="#ffffff"
  >
    F
  </text>
</svg>
